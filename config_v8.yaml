# ==============================================================================
# UNIVAC-IX CORE FABRIC CONFIGURATION MANAGEMENT
# Orchestration Matrix for Tiger Nodes, Turnkey Bridges, and Bridges Turf Stages
# ==============================================================================

global_cluster_settings:
  cluster_identity: "UNIVAC-IX-PLATFORM-ALPHA"
  system_ram_capacity_gb: 1024 # 1 TB Hardware Memory Pool Allocator
  total_system_cpus: 64        # Multi-Core Processing Core Execution Units
  total_system_gpus: 2         # Dual NVIDIA L4 Dedicated Graphics Engines
  environment_overrides:
    RAY_EXPERIMENTAL_NOSET_CUDA_VISIBLE_DEVICES: "1"
    RAY_ENABLE_UV_RUN_RUNTIME_ENV: "0"

pipeline_stages:
  - stage_name: "Stage_00_Tiger_Data_Carver"
    module_class: "cosmos_tiger_orchestrator.CosmosTigerVisPipelineStage"
    batch_size: 50000
    resource_allocation:
      cpus: 24.0
      gpus: 0.8
      is_spmd: true
    data_stream_source: "salvaged_log.txt"
    visio_tracking_id: "N-01"

  - stage_name: "Stage_01_Turnkey_Industrial_Bridge"
    module_class: "turnkey_industrial_stage.TurnkeyIndustrialBridgeStage"
    batch_size: 25000
    resource_allocation:
      cpus: 20.0
      gpus: 0.6
      is_spmd: true
    data_stream_source: "salvaged_log.txt"
    visio_tracking_id: "N-02"

  - stage_name: "Stage_02_Bridges_Turf_Automation"
    module_class: "bridges_turf_stage.BridgesTurfAutomationStage"
    batch_size: 15000
    resource_allocation:
      cpus: 20.0
      gpus: 0.6
      is_spmd: true
    data_stream_source: "live_turf_stream.raw"
    visio_tracking_id: "N-03"

telemetry_visio_exporter:
  output_target_csv: "visio_mapping.csv"
  refresh_rate_seconds: 1.0
  hazard_alert_rules:
    sound_terminal_bell_on_critical: true
    critical_threshold_percentage: 85.0

  - stage_name: "Stage_03_Bennan_Pattern_Recognition"
    module_class: "bennan_bayes_stage.BridgesBennanBayesStage"
    batch_size: 30000
    resource_allocation:
      cpus: 16.0
      gpus: 0.4
      is_spmd: true
    data_stream_source: "satellite_telemetry.raw"
    visio_tracking_id: "N-05"

      - stage_name: "Stage_04_Stellar_PLA_Traffic_Orchestrator"
    module_class: "stellar_traffic_stage.StellarPlaTrafficOrchestratorStage"
    batch_size: 40000
    resource_allocation:
      cpus: 16.0
      gpus: 0.4
      is_spmd: true
    data_stream_source: "stellar_pla_grid.raw"
    visio_tracking_id: "N-06"

  - stage_name: "Stage_08_Siemens_S7_Data_Block"
    module_class: "siemens_s7_stage.SiemensS7DataBlockStage"
    batch_size: 22000
    resource_allocation:
      cpus: 12.0
      gpus: 0.2
      is_spmd: true
    data_stream_source: "siemens_db_registers.raw"
    visio_tracking_id: "N-11"

      - stage_name: "Stage_09_Kirkland_Cost_Calculator"
    module_class: "kirkland_calculator_stage.KirklandCostCalculatorStage"
    batch_size: 45000
    resource_allocation:
      cpus: 10.0
      gpus: 0.1
      is_spmd: true
    data_stream_source: "kirkland_supply_ledger.raw"
    visio_tracking_id: "N-12"

      - stage_name: "Stage_10_Stellar_Punk_Steam"
    module_class: "stellarpunk_steam_stage.StellarPunkSteamStage"
    batch_size: 32000
    resource_allocation:
      cpus: 10.0
      gpus: 0.1
      is_spmd: true
    data_stream_source: "stellar_steam_kinetics.raw"
    visio_tracking_id: "N-13"
